<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10秒チャレンジ | TAKEMOCHI LAB</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f7f5ef;color:#181818;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;padding:24px}.game{width:min(520px,100%);text-align:center;background:#fff;border:2px solid #181818;border-radius:32px;padding:34px 22px;box-shadow:8px 8px 0 #181818}.tag{font-size:12px;font-weight:800;letter-spacing:.16em}.emoji{font-size:48px;margin:10px 0}h1{font-size:clamp(38px,11vw,64px);line-height:1;margin:0}.desc{line-height:1.8;color:#666;margin:18px 0 26px}.timer{font-variant-numeric:tabular-nums;font-size:clamp(52px,16vw,88px);font-weight:900;letter-spacing:-.05em;margin:18px 0}.hidden-time{color:#aaa}.buttons{display:grid;gap:12px}.btn{border:0;border-radius:999px;padding:18px 22px;font-size:18px;font-weight:900;cursor:pointer;background:#181818;color:#fff}.btn.stop{background:#ff5b45}.btn:disabled{opacity:.35}.result{min-height:82px;margin-top:22px;font-size:18px;font-weight:700;line-height:1.6}.score{font-size:30px;font-weight:900}.perfect{font-size:34px}.note{font-size:12px;color:#999;margin-top:18px}a{color:inherit}
</style>
</head>
<body>
<main class="game">
<div class="tag">TAKEMOCHI LAB / MINI GAME</div>
<div class="emoji">⏱️</div>
<h1>10秒<br>チャレンジ</h1>
<p class="desc">STARTを押したら時間表示が消えます。<br>体感で10秒ぴったりを狙ってSTOP！</p>
<div id="timer" class="timer">0.00</div>
<div class="buttons">
<button id="start" class="btn">START</button>
<button id="stop" class="btn stop" disabled>STOP!</button>
</div>
<div id="result" class="result">10.00秒を狙ってみよう🔥</div>
<div class="note">AIと一緒に作ったミニゲーム 🤖</div>
</main>
<script>
const timer=document.getElementById('timer'),startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),result=document.getElementById('result');let startAt=0,raf=null,running=false;
function tick(){if(!running)return;const t=(performance.now()-startAt)/1000;timer.textContent=t.toFixed(2);raf=requestAnimationFrame(tick)}
startBtn.onclick=()=>{running=true;startAt=performance.now();result.textContent='時間は見えないよ…感覚だけで勝負！';timer.textContent='0.00';timer.classList.add('hidden-time');timer.style.visibility='hidden';startBtn.disabled=true;stopBtn.disabled=false;raf=requestAnimationFrame(tick)};
stopBtn.onclick=()=>{if(!running)return;running=false;cancelAnimationFrame(raf);const t=(performance.now()-startAt)/1000,d=Math.abs(t-10);timer.style.visibility='visible';timer.classList.remove('hidden-time');timer.textContent=t.toFixed(2);let msg='';if(d<.01)msg='<span class="perfect">🎯 PERFECT!!</span><br>10秒ジャスト！';else if(d<.1)msg='🔥 惜しい！ほぼ10秒！';else if(d<.3)msg='👏 かなりいい感覚！';else if(d<1)msg='😆 あとちょっと！';else msg='😂 もう一回いこう！';result.innerHTML='<span class="score">'+t.toFixed(2)+'秒</span><br>'+msg+'<br><small>誤差 '+d.toFixed(2)+'秒</small>';startBtn.textContent='もう一回';startBtn.disabled=false;stopBtn.disabled=true};
</script>
</body>
</html>
